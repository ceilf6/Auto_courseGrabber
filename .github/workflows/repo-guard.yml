name: Repo Guard

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  guard:
    if: >
      github.actor != 'dependabot[bot]' &&
      (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event_name == 'issues' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
        ) ||
        (
          github.event_name == 'issue_comment' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    # REPO_GUARD_RUNNER 指向自托管 runner(如 repo-guard-claude)时,
    # REPO_GUARD_ENGINE=claude-code 在 runner 本机跑 Claude Code CLI 评审。
    runs-on: ${{ vars.REPO_GUARD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      # PR 评审的工作目录:checkout 即评审数据,凭据不落盘。
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
          persist-credentials: false
      - uses: ceilf6/repo-guard@main
        with:
          type: both
          engine: ${{ vars.REPO_GUARD_ENGINE || 'api' }}
          claude-model: ${{ vars.CLAUDE_CODE_MODEL }}
          provider: ${{ vars.LLM_PROVIDER }}
          model: ${{ vars.LLM_MODEL }}
          api-key: ${{ secrets.LLM_API_KEY }}
          base-url: ${{ vars.LLM_BASE_URL }}
